<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Museum</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-overlay">
      <div class="hero-content">
        <h1>Moon Museum</h1>
        <h2>Featured Sailor Guardians</h2>
      </div>
    </div>
  </section>

  <!-- FEATURED CARDS (LIFTED INTO THE FADE) -->
  <section class="cards-section">
    <div class="gallery-grid">

      <!-- Usagi -->
      <a href="player-usagi.html" class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="images/usagi-front.jpeg" alt="Usagi Tsukino front card">
          </div>
          <div class="card-back">
            <img class="back-img" src="images/usagi-back.jpeg" alt="Usagi Tsukino back card">
            <div class="stats">
              <p>Power: 8</p>
              <p>Speed: 6</p>
              <p>Magic: 10</p>
            </div>
          </div>
        </div>
      </a>

      <!-- Ami -->
      <a href="player-ami.html" class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="images/ami-front.jpeg" alt="Ami Mizuno front card">
          </div>
          <div class="card-back">
            <img class="back-img" src="images/ami-back.jpeg" alt="Ami Mizuno back card">
            <div class="stats">
              <p>Power: 7</p>
              <p>Speed: 8</p>
              <p>Magic: 9</p>
            </div>
          </div>
        </div>
      </a>

      <!-- Rei -->
      <a href="player-rei.html" class="card">
        <div class="card-inner">
          <div class="card-front">
            <img src="images/rei-front.jpeg" alt="Rei Hino front card">
          </div>
          <div class="card-back">
            <img class="back-img" src="images/rei-back.jpeg" alt="Rei Hino back card">
            <div class="stats">
              <p>Power: 9</p>
              <p>Speed: 7</p>
              <p>Magic: 9</p>
            </div>
          </div>
        </div>
      </a>

    </div>
  </section>

</body>
</html>
