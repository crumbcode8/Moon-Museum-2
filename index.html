<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Museum</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>

<body>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
  </nav>

  <section class="player-hero">
    <h1>Welcome to the Moon Museum</h1>
    <h2>A Sailor Moon Character Showcase</h2>
  </section>

  <section class="gallery-grid">

    <!-- USAGI -->
    <a href="player-usagi.html" class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="images/usagi-front.jpeg">
        </div>
        <div class="card-back">
          <img class="back-img" src="images/usagi-back.jpeg">
          <div class="stats">
            <p>Power: 8</p>
            <p>Speed: 6</p>
            <p>Magic: 10</p>
          </div>
        </div>
      </div>
    </a>

    <!-- AMI -->
    <a href="player-ami.html" class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="images/ami-front.jpeg">
        </div>
        <div class="card-back">
          <img class="back-img" src="images/ami-back.jpeg">
          <div class="stats">
            <p>Power: 7</p>
            <p>Speed: 8</p>
            <p>Magic: 9</p>
          </div>
        </div>
      </div>
    </a>

    <!-- REI -->
    <a href="player-rei.html" class="card">
      <div class="card-inner">
        <div class="card-front">
          <img src="images/rei-front.jpeg">
        </div>
        <div class="card-back">
          <img class="back-img" src="images/rei-back.jpeg">
          <div class="stats">
            <p>Power: 9</p>
            <p>Speed: 7</p>
            <p>Magic: 9</p>
          </div>
        </div>
      </div>
    </a>

  </section>

</html>
